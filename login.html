<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Gestion d'école</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <form class="login-box" id="loginForm" action="index.html" method="post">
    <h1>Gestion d'école</h1>
    <p>Connectez-vous pour accéder à votre espace.</p>

    <div class="field">
      <label for="email">Adresse e-mail</label>
      <input type="email" id="email" name="email" placeholder="admin@ecole.ma" required>
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required>
    </div>

    <div class="field">
      <label for="role">Profil</label>
      <select id="role" name="role">
        <option>Administrateur</option>
        <option>Enseignant</option>
        <option>Secrétariat</option>
        <option>Élève</option>
      </select>
    </div>

    <button type="submit" class="btn">Se connecter</button>
  </form>

  <script>
    // Redirection selon le profil choisi (démonstration, sans vraie authentification)
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var role = document.getElementById('role').value;
      window.location.href = (role === 'Élève') ? 'eleve-accueil.html' : 'index.html';
    });
  </script>
</body>
</html>
